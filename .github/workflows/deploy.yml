name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pick up new signatures from the mirrors
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: git submodule update --remote
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.10'
      - run: make
      - run: mkdir -p _site && cp index.html CNAME _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
